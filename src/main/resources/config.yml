# TwiOpSec configuration. Identity decisions use UUIDs; names are informational.
schema-version: 1

enforcement:
  enabled: true
  check-on-join: true
  check-on-command: true
  check-on-interact: true
  check-on-chat: true
  periodic-enabled: true
  periodic-seconds: 2
  require-online-op-target: true
  deop-unauthorized: true
  kick-unauthorized-operator: true
  kick-unauthorized-permission: true
  kick-message: "TwiOpSec: this account is not authorized for elevated access."
  unauthorized-operator-commands: []
  unauthorized-permission-commands: []

# Positive assignments matching protected-permissions are intercepted before
# known permission commands run. LuckPerms changes are additionally observed
# through its API; Vault/SuperPerms provide a best-effort fallback for other
# permission managers. Trusted UUIDs may retain protected nodes, but groups may
# never hold them because group membership is not an identity trust boundary.
permission-remediation:
  enabled: true
  block-command-grants: true
  luckperms-native-hook: true
  vault-fallback: true
  bukkit-attachment-fallback: true

# Defaults are always unioned with imported T2C permissions and cannot disappear
# merely because an older configuration is imported.
protected-permissions:
  - "*"
  - "minecraft.*"
  - "minecraft.command.*"
  - "minecraft.command.op"
  - "bukkit.command.*"
  - "paper.command.*"
  - "essentials.*"
  - "luckperms.*"
  - "twiopsec.admin"

# Permission-management command roots. The five defaults remain active even if
# this list is emptied. Untrusted players and command blocks are denied; the
# local/remote console remains allowed. Add aliases used by your server.
privilege-command-roots:
  - "lp"
  - "luckperms"
  - "lpb"
  - "permissions"
  - "pex"

trusted:
  operators: {}
  permission-holders: {}

legacy-import:
  automatic: true
  source-folder: "T2C-OPSecurity"
  preserve-default-permissions: true

updates:
  # Checks only fixed HTTPS release endpoints. GitHub is authoritative; GitLab is
  # contacted only when GitHub is unreachable or returns an invalid response.
  # TwiOpSec never downloads or executes an update automatically.
  enabled: true
  connect-timeout-seconds: 5
  request-timeout-seconds: 5

compatibility:
  citizens:
    # Disabled by default. When enabled, only genuine Citizens-owned player NPC
    # metadata may bypass the permission-state precheck for one direct
    # /server <target> command with a conservative target-name format.
    # OP, permission-management and unload protections remain fully enforced.
    server-command-npc-bypass: false

hardening:
  # This compatibility key cannot disable the invariant; false is ignored with a warning.
  block-runtime-unload-commands: true
  # Add the command root of any runtime plugin manager installed on the server.
  # Built-in known roots are always retained when this list is edited.
  runtime-plugin-manager-roots:
    - "plugman"
    - "plugmanx"
    - "plm"
    - "pluginmanager"
    - "plugin-manager"
    - "plugmanager"
    - "plugincontrol"
    - "plugincontroller"
    - "serverutils"
    - "serverutilities"
    - "pm"
    - "pman"
  audit-log: true
  # The queue is bounded to 128..65536. Audit files rotate at 16 MiB and keep five archives.
  audit-queue-capacity: 2048
